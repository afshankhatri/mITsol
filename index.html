    <script>
      (function () {
        const baseUrl = "https://www.meridianinfotechsolutions.in";
        const path = window.location.pathname.replace(/\/$/, ""); // remove trailing slash
        const segments = path.split("/").filter(Boolean); // e.g. ["services", "laptop-repair"]

        // Optional: map slugs to custom display names when the slug doesn't read well as-is
        const nameOverrides = {
          "amc-services": "AMC Services",
          "ios-services": "iOS Services"
        };

        function slugToName(slug) {
          if (nameOverrides[slug]) return nameOverrides[slug];
          return slug
            .split("-")
            .map(word => word.charAt(0).toUpperCase() + word.slice(1))
            .join(" ");
        }

        const itemListElement = [
          {
            "@type": "ListItem",
            "position": 1,
            "name": "Home",
            "item": baseUrl + "/"
          }
        ];

        let urlAccumulator = baseUrl;
        segments.forEach((seg, index) => {
          urlAccumulator += "/" + seg;
          itemListElement.push({
            "@type": "ListItem",
            "position": index + 2,
            "name": slugToName(seg),
            "item": urlAccumulator + "/"
          });
        });

        const schema = {
          "@context": "https://schema.org",
          "@type": "BreadcrumbList",
          "itemListElement": itemListElement
        };

        const script = document.createElement("script");
        script.type = "application/ld+json";
        script.text = JSON.stringify(schema);
        document.head.appendChild(script);
      })();
    </script>

    <script>
      (function () {
        // Adjust these selectors to match your FAQ section's actual HTML structure
        const faqContainer = document.querySelector(".faq-section, #faq, [data-faq]");
        if (!faqContainer) return; // no FAQ on this page, skip schema

        const questionEls = faqContainer.querySelectorAll(".faq-question, .accordion-title, summary");
        const answerEls = faqContainer.querySelectorAll(".faq-answer, .accordion-content, details > div");

        if (!questionEls.length || questionEls.length !== answerEls.length) return;

        const mainEntity = [];
        questionEls.forEach((qEl, i) => {
          const question = qEl.textContent.trim();
          const answer = answerEls[i].textContent.trim();
          if (question && answer) {
            mainEntity.push({
              "@type": "Question",
              "name": question,
              "acceptedAnswer": {
                "@type": "Answer",
                "text": answer
              }
            });
          }
        });

        if (!mainEntity.length) return;

        const schema = {
          "@context": "https://schema.org",
          "@type": "FAQPage",
          "mainEntity": mainEntity
        };

        const script = document.createElement("script");
        script.type = "application/ld+json";
        script.text = JSON.stringify(schema);
        document.head.appendChild(script);
      })();
    </script>
